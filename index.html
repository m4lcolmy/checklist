<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uçuş Öncesi Checklist</title>
<meta name="theme-color" id="theme-color-meta" content="#EDE7DA">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<script src="./js/theme.js"></script>
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div id="app">

  <header id="topbar">
    <h1 id="app-title">Uçuş Öncesi Checklist</h1>
    <div id="topbar-search" hidden>
      <input id="search-input" type="search" placeholder="Ara..." inputmode="search" autocomplete="off">
      <button id="search-clear" hidden aria-label="Aramayı temizle">✕</button>
    </div>
    <button id="search-toggle-btn" aria-label="Madde ara">Ara</button>
    <div id="arm-badge" data-armed="false" aria-live="polite"><span id="arm-label">ARM</span> <span id="arm-count" class="mono"></span></div>
    <button id="menu-btn" aria-label="Menü" aria-haspopup="true"><span class="hamburger"><span></span><span></span><span></span></span></button>
  </header>
  <div id="progress-bar"><div id="progress-fill" style="width:0%"></div></div>

  <main id="main">
    <div id="view-run">
      <div id="arm-print-status"></div>
      <section id="template-notice" role="region" aria-labelledby="template-notice-title" aria-live="polite" aria-atomic="true" hidden>
        <div id="template-notice-content">
          <strong id="template-notice-title" tabindex="-1"></strong>
          <p id="template-notice-text"></p>
          <div id="template-notice-actions">
            <button id="template-update-accept" type="button" hidden>Güncellemeyi uygula</button>
            <button id="template-update-decline" type="button" hidden>Bu güncellemeyi atla</button>
          </div>
        </div>
        <button id="template-notice-dismiss" type="button" aria-label="Güncelleme bildirimini kapat" hidden>✕</button>
      </section>
      <div id="tpl-meta-row"><span id="tpl-version-badge" class="mono"></span></div>
      <div id="flight-header">
        <div>
          <label for="f-date">Tarih</label>
          <input id="f-date" type="date" inputmode="none">
        </div>
        <div>
          <label for="f-aircraft">Uçak / Deneme no</label>
          <input id="f-aircraft" type="text" inputmode="text">
        </div>
        <div class="field-full">
          <label for="f-wind">Rüzgar / Hava</label>
          <input id="f-wind" type="text" inputmode="text">
        </div>
        <div class="field-full">
          <label id="f-note-label" for="f-note">Uçuş notu</label>
          <div id="flight-note-editor" class="rich-note-editor">
            <div class="rich-note-toolbar" data-rich-note-toolbar role="toolbar" aria-label="Uçuş notu biçimlendirme">
              <button type="button" data-rich-command="bold" aria-label="Kalın" aria-pressed="false" title="Kalın (Ctrl+B)"><strong>K</strong></button>
              <button type="button" data-rich-command="italic" aria-label="İtalik" aria-pressed="false" title="İtalik (Ctrl+I)"><em>İ</em></button>
              <button type="button" data-rich-command="insertOrderedList" aria-label="Numaralı liste" aria-pressed="false" title="Numaralı liste">1.</button>
              <button type="button" data-rich-command="insertUnorderedList" aria-label="Madde işaretli liste" aria-pressed="false" title="Madde işaretli liste">•</button>
              <button type="button" data-rich-command="removeFormat" aria-label="Biçimlendirmeyi temizle" aria-pressed="false" title="Biçimlendirmeyi temizle">Tx</button>
            </div>
            <div id="f-note" class="rich-note-input" data-rich-note-input contenteditable="true" role="textbox" aria-multiline="true" aria-labelledby="f-note-label" data-placeholder="Uçuşla ilgili notlar…" spellcheck="true"><p><br></p></div>
          </div>
        </div>
      </div>

      <div id="lists-root"></div>
    </div>

    <div id="view-history" hidden>
      <button class="back-btn" data-back>‹ Geri</button>
      <h2 style="font-size:18px;font-weight:700;margin-bottom:12px;">Geçmiş uçuşlar</h2>
      <div id="history-list"></div>
    </div>

    <div id="view-run-readonly" hidden>
      <div id="history-detail-bar">
        <button class="back-btn" data-back>‹ Geri</button>
        <button id="history-edit-toggle" type="button" data-editing="false">Düzenle</button>
      </div>
      <div id="readonly-flight-header"></div>
      <div id="history-flight-header" hidden>
        <div>
          <label for="h-date">Tarih</label>
          <input id="h-date" type="date" inputmode="none">
        </div>
        <div>
          <label for="h-aircraft">Uçak / Deneme no</label>
          <input id="h-aircraft" type="text" inputmode="text">
        </div>
        <div class="field-full">
          <label for="h-wind">Rüzgar / Hava</label>
          <input id="h-wind" type="text" inputmode="text">
        </div>
        <div class="field-full">
          <label id="h-note-label" for="h-note">Uçuş notu</label>
          <div id="history-note-editor" class="rich-note-editor">
            <div class="rich-note-toolbar" data-rich-note-toolbar role="toolbar" aria-label="Uçuş notu biçimlendirme">
              <button type="button" data-rich-command="bold" aria-label="Kalın" aria-pressed="false" title="Kalın (Ctrl+B)"><strong>K</strong></button>
              <button type="button" data-rich-command="italic" aria-label="İtalik" aria-pressed="false" title="İtalik (Ctrl+I)"><em>İ</em></button>
              <button type="button" data-rich-command="insertOrderedList" aria-label="Numaralı liste" aria-pressed="false" title="Numaralı liste">1.</button>
              <button type="button" data-rich-command="insertUnorderedList" aria-label="Madde işaretli liste" aria-pressed="false" title="Madde işaretli liste">•</button>
              <button type="button" data-rich-command="removeFormat" aria-label="Biçimlendirmeyi temizle" aria-pressed="false" title="Biçimlendirmeyi temizle">Tx</button>
            </div>
            <div id="h-note" class="rich-note-input" data-rich-note-input contenteditable="true" role="textbox" aria-multiline="true" aria-labelledby="h-note-label" data-placeholder="Uçuşla ilgili notlar…" spellcheck="true"><p><br></p></div>
          </div>
        </div>
      </div>
      <div id="readonly-lists-root"></div>
    </div>

    <div id="view-edit" hidden>
      <div id="edit-banner">
        <span>DÜZENLEME MODU</span>
        <div id="edit-banner-actions">
          <button id="reset-template-btn" type="button" hidden>Şablonu sıfırla</button>
          <button data-back>Bitti</button>
        </div>
      </div>
      <p id="edit-hint">Kritik: madde işaretlenmemişken vurgu renginde gösterilir.</p>
      <div id="edit-root"></div>
      <button id="edit-add-section">+ Bölüm ekle</button>
    </div>
  </main>

  <nav id="bottombar">
    <div id="nav-row">
      <button id="nav-prev" aria-label="Önceki bölüm">‹</button>
      <div id="nav-pos" class="mono">1/1</div>
      <button id="nav-next" aria-label="Sonraki bölüm">›</button>
      <button id="new-flight-btn"><div id="new-flight-fill"></div><span id="new-flight-text">Yeni Uçuş</span></button>
    </div>
  </nav>

  <div id="menu-overlay" hidden>
    <div id="menu-sheet" role="menu">
      <button data-action="history"><span class="menu-icon">↺</span>Geçmiş uçuşlar</button>
      <button data-action="edit"><span class="menu-icon">▤</span>Şablonu düzenle</button>
      <button data-action="export-run"><span class="menu-icon">↑</span>Uçuşu dışa aktar (.json)</button>
      <button data-action="import-run"><span class="menu-icon">↓</span>Uçuşu içe aktar (.json)</button>
      <button data-action="print"><span class="menu-icon">▭</span>Yazdır / PDF</button>
      <div class="menu-group" data-group="export-tpl">
        <button data-action="toggle-export-tpl" aria-expanded="false"><span class="menu-icon">↑</span>Şablonu dışa aktar<span class="menu-chevron">▸</span></button>
        <div class="menu-subrow" hidden>
          <button data-action="export-tpl-pdf">PDF olarak indir</button>
          <button data-action="export-tpl-json">JSON olarak indir (.json)</button>
        </div>
      </div>
      <button data-action="import-tpl"><span class="menu-icon">↓</span>Şablon içe aktar (.json / .xlsx)</button>
      <div class="menu-section-label">Tema</div>
      <div class="theme-picker" id="theme-picker">
        <button data-action="set-theme" data-theme="current">Mevcut</button>
        <button data-action="set-theme" data-theme="light">Açık</button>
        <button data-action="set-theme" data-theme="black">Siyah</button>
        <button data-action="set-theme" data-theme="system">Sistem</button>
      </div>
      <button data-action="close"><span class="menu-icon">✕</span>Kapat</button>
    </div>
  </div>
  <input type="file" id="file-import-tpl" accept=".json,.xlsx">
  <input type="file" id="file-import-run" accept=".json">

  <div id="toast-wrap" role="status" aria-live="polite" aria-atomic="true"></div>
</div>

<script src="./js/xlsx.min.js"></script>
<script src="./js/jspdf.umd.min.js"></script>
<script src="./js/pdf-fonts.js"></script>
<script src="./js/pdf-export.js"></script>
<script src="./js/default-template.js"></script>
<script src="./js/rich-text-editor.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
